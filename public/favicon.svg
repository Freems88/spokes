<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Spokes</title>
  <style>
    .hub { fill: #2b2b2b; }
    .ring { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .hub { fill: #f0efec; }
      .ring { fill: #1a1a19; }
    }
  </style>
  <!-- Three rides converging on one hub: West (blue), North (aqua), East (orange). -->
  <g transform="translate(0 2.4)">
  <g stroke-linecap="round" stroke-width="3.4" fill="none">
    <path d="M4.5 23 L16 18.5" stroke="#2a78d6"/>
    <path d="M13.5 4.5 L16 18.5" stroke="#1baf7a"/>
    <path d="M27.5 10 L16 18.5" stroke="#eb6834"/>
  </g>
  <circle cx="4.5" cy="23" r="3.2" fill="#2a78d6"/>
  <circle cx="13.5" cy="4.5" r="3.2" fill="#1baf7a"/>
  <circle cx="27.5" cy="10" r="3.2" fill="#eb6834"/>
  <circle class="ring" cx="16" cy="18.5" r="7"/>
  <circle class="hub" cx="16" cy="18.5" r="5.4"/>
  </g>
</svg>
